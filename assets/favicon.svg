<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <title>Pink pixel mushroom</title>
  <!-- Exact copy of the 16x16 mushroom sprite the Project Kryat page floats as
       decoration (the kr-shroom custom property in work/project-kryat/index.html),
       so the two never drift apart.
       Placeholder icon: to swap it, replace this file and the favicon PNGs.
       WARNING: SVG is XML, so a comment must never contain a double hyphen.
       Writing the variable name with its leading dashes here made this file
       fail to parse and the icon silently fell back to the PNG. -->
  <g fill="#4A2E3D">
    <rect x="4" y="1" width="8" height="8"/>
    <rect x="2" y="3" width="12" height="6"/>
    <rect x="5" y="9" width="6" height="6"/>
  </g>
  <g fill="#D9457A">
    <rect x="5" y="2" width="6" height="6"/>
    <rect x="3" y="4" width="10" height="4"/>
  </g>
  <g fill="#F2E4C8">
    <rect x="6" y="10" width="4" height="5"/>
  </g>
  <g fill="#C9A85C">
    <rect x="6" y="4" width="2" height="2"/>
    <rect x="9" y="5" width="2" height="2"/>
    <rect x="4" y="6" width="2" height="1"/>
  </g>
</svg>
